<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow - Autenticação de Acesso</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const t = localStorage.getItem('docflow_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="stylesheet" href="paleta.css">
    <link rel="stylesheet" href="formulario.css">
  </head>
  <body class="login-body">
    <!-- Barra superior minimalista -->
    <header class="login-top-bar">
      <div class="login-brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <span class="login-brand-name">DocFlow</span>
      </div>

      <div class="login-theme-toggle">
        <button type="button" id="btn-toggle-theme" class="theme-icon-btn" title="Alternar Modo Claro / Escuro" aria-label="Alternar Tema">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Container Central de Login -->
    <main class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="login-card-badge">Portal Corporativo</div>
          <h1 class="login-title">Acesse sua Conta</h1>
          <p class="login-subtitle">Informe seu e-mail e senha cadastrados para acessar a tramitação e o fluxo documental.</p>
        </div>

        <form id="form-login" class="login-form" novalidate>
          <div class="login-form-group">
            <label for="input-email" class="login-label">E-mail Corporativo</label>
            <div class="login-input-wrapper">
              <svg class="login-field-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input 
                type="email" 
                id="input-email" 
                name="email" 
                class="login-input" 
                placeholder="seu.nome@monto.com.br" 
                required 
                autocomplete="email"
                autofocus
              >
            </div>
          </div>

          <div class="login-form-group">
            <div class="login-label-row">
              <label for="input-senha" class="login-label">Senha de Acesso</label>
            </div>
            <div class="login-input-wrapper">
              <svg class="login-field-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input 
                type="password" 
                id="input-senha" 
                name="senha" 
                class="login-input password-input" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
              >
              <button type="button" id="btn-toggle-senha" class="btn-toggle-password" title="Visualizar senha" aria-label="Visualizar senha">
                <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eye-off-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Mensagem de Erro / Alerta -->
          <div id="login-error-alert" class="login-alert danger" style="display: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="login-error-text">E-mail ou senha inválidos.</span>
          </div>

          <button type="submit" id="btn-submit-login" class="btn-login-submit">
            <span>Acessar DocFlow</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Contas Rápidas para Demonstração / Teste -->
        <div class="login-demo-section">
          <div class="login-demo-header">
            <span>Acesso Rápido para Teste</span>
          </div>
          <div class="login-demo-grid" id="login-demo-grid">
            <button type="button" class="btn-demo-pill" data-email="eric.machado@monto.com.br" data-senha="monto@123">
              <span class="demo-avatar">E</span>
              <div class="demo-info">
                <strong>Eric Machado</strong>
                <small>Administrador</small>
              </div>
            </button>
            <button type="button" class="btn-demo-pill" data-email="polyana@monto.com.br" data-senha="monto@123">
              <span class="demo-avatar">P</span>
              <div class="demo-info">
                <strong>Polyana</strong>
                <small>Custos</small>
              </div>
            </button>
            <button type="button" class="btn-demo-pill" data-email="claudia@monto.com.br" data-senha="monto@123">
              <span class="demo-avatar">C</span>
              <div class="demo-info">
                <strong>Claudia dos Santos</strong>
                <small>Qualidade</small>
              </div>
            </button>
          </div>
        </div>

        <div class="login-footer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Base de usuários gerenciada na aba <strong>Usuários</strong> do Excel / SharePoint.</span>
        </div>
      </div>
    </main>

    <!-- Script de Autenticação Integrado ao Power Automate e Excel -->
    <script type="module">
      import { 
        autenticar, 
        obterUsuarios,
        obterUsuarioAtual, 
        estaAutenticado 
      } from './auth-service.js';
      import { 
        definirTema, 
        obterTemaAtual,
        buscarDadosDoPowerAutomate 
      } from './data-service.js';

      // Redirecionamento automático se já estiver logado
      const params = new URLSearchParams(window.location.search);
      const destinoRedirect = params.get('redirect') || 'index.html';

      if (estaAutenticado()) {
        window.location.replace(destinoRedirect);
      }

      // Alternância de Tema Claro / Escuro
      const btnToggleTema = document.getElementById('btn-toggle-theme');
      if (btnToggleTema) {
        btnToggleTema.addEventListener('click', () => {
          const temaAtual = obterTemaAtual();
          const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
          definirTema(novoTema);
        });
      }

      // Alternância de visibilidade da senha
      const btnToggleSenha = document.getElementById('btn-toggle-senha');
      const inputSenha = document.getElementById('input-senha');
      const eyeIcon = document.getElementById('eye-icon');
      const eyeOffIcon = document.getElementById('eye-off-icon');

      if (btnToggleSenha && inputSenha) {
        btnToggleSenha.addEventListener('click', () => {
          const tipoAtual = inputSenha.getAttribute('type');
          if (tipoAtual === 'password') {
            inputSenha.setAttribute('type', 'text');
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
          } else {
            inputSenha.setAttribute('type', 'password');
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
          }
        });
      }

      // Vincula cliques nas pílulas de teste
      function vincularEventosDemoPills() {
        const botoesDemo = document.querySelectorAll('.btn-demo-pill');
        botoesDemo.forEach(btn => {
          btn.onclick = () => {
            const email = btn.getAttribute('data-email');
            const senha = btn.getAttribute('data-senha');
            const inputEmail = document.getElementById('input-email');
            if (inputEmail && inputSenha) {
              inputEmail.value = email;
              inputSenha.value = senha;
              esconderErro();
              btn.classList.add('selected');
              setTimeout(() => btn.classList.remove('selected'), 600);
            }
          };
        });
      }

      // Atualiza pílulas com os usuários reais vindos do Excel
      function atualizarDemoPillsComUsuariosExcel() {
        const container = document.getElementById('login-demo-grid');
        if (!container) return;

        const usuarios = obterUsuarios().filter(u => u.status?.toLowerCase() === 'ativo');
        if (!usuarios || usuarios.length === 0) return;

        // Limita a até 3 ou 4 usuários para exibição limpa
        const exibidos = usuarios.slice(0, 4);
        container.innerHTML = exibidos.map(u => {
          const inicial = (u.nome || u.email || 'U').charAt(0).toUpperCase();
          return `
            <button type="button" class="btn-demo-pill" data-email="${u.email}" data-senha="${u.senha || 'monto@123'}">
              <span class="demo-avatar">${inicial}</span>
              <div class="demo-info">
                <strong>${u.nome}</strong>
                <small>${u.perfil || u.area || 'Geral'}</small>
              </div>
            </button>
          `;
        }).join('');

        vincularEventosDemoPills();
      }

      // Inicializa eventos locais das pílulas padrão
      vincularEventosDemoPills();

      // Sincroniza usuários da nuvem em segundo plano ao abrir o login
      buscarDadosDoPowerAutomate()
        .then(() => {
          atualizarDemoPillsComUsuariosExcel();
        })
        .catch(err => {
          console.warn("DocFlow: Sincronização em segundo plano no login:", err);
        });

      // Feedback de erro
      const alertaErro = document.getElementById('login-error-alert');
      const textoErro = document.getElementById('login-error-text');

      function mostrarErro(mensagem) {
        if (textoErro) textoErro.textContent = mensagem;
        if (alertaErro) alertaErro.style.display = 'flex';
      }

      function esconderErro() {
        if (alertaErro) alertaErro.style.display = 'none';
      }

      document.getElementById('input-email')?.addEventListener('input', esconderErro);
      document.getElementById('input-senha')?.addEventListener('input', esconderErro);

      // Submissão do Formulário de Login
      const formLogin = document.getElementById('form-login');
      const btnSubmit = document.getElementById('btn-submit-login');

      if (formLogin) {
        formLogin.addEventListener('submit', async (e) => {
          e.preventDefault();
          esconderErro();

          const email = document.getElementById('input-email')?.value?.trim();
          const senha = document.getElementById('input-senha')?.value;

          if (!email || !senha) {
            mostrarErro('Por favor, informe tanto o e-mail quanto a senha.');
            return;
          }

          if (btnSubmit) {
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;">
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
              </svg>
              <span>Autenticando...</span>
            `;
          }

          // 1. Tenta autenticar com base no cache local
          let resultado = autenticar(email, senha);

          // 2. Se o usuário não foi encontrado localmente, busca imediatamente no Power Automate / Excel da nuvem
          if (!resultado.sucesso && resultado.erro && resultado.erro.includes('não cadastrado')) {
            try {
              await buscarDadosDoPowerAutomate();
              atualizarDemoPillsComUsuariosExcel();
              resultado = autenticar(email, senha);
            } catch (errSync) {
              console.warn("Falha ao sincronizar usuários no login:", errSync);
            }
          }

          if (resultado.sucesso) {
            if (btnSubmit) {
              btnSubmit.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>Bem-vindo! Redirecionando...</span>
              `;
            }
            window.location.replace(destinoRedirect);
          } else {
            if (btnSubmit) {
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = `
                <span>Acessar DocFlow</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              `;
            }
            mostrarErro(resultado.erro || 'E-mail ou senha inválidos.');
          }
        });
      }
    </script>
  </body>
</html>
